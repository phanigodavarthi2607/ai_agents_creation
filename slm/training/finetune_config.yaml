# Fine-tuning configuration for QA Domain SLM
# Compatible with Unsloth, Axolotl, and HuggingFace Trainer
#
# Prerequisites:
#   1. Generate training data: python -m slm generate-training
#   2. Get GPU access (Google Colab free tier works for Phi-3-mini)
#   3. Install: pip install unsloth transformers datasets peft
#
# To fine-tune with Unsloth (recommended for speed):
#   python slm/training/finetune.py
#
# To fine-tune with Axolotl:
#   axolotl train slm/training/finetune_config.yaml

# Model
base_model: microsoft/Phi-3-mini-4k-instruct
model_type: AutoModelForCausalLM
load_in_4bit: true

# Dataset
dataset_path: knowledge_base/training_data/train_chatml.jsonl
dataset_type: chatml

# LoRA Configuration (Parameter-Efficient Fine-Tuning)
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Training Hyperparameters
training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_steps: 10
  max_seq_length: 2048
  fp16: true
  logging_steps: 10
  save_steps: 50
  eval_steps: 50

# Output
output_dir: models/qa-slm-phi3-lora
save_total_limit: 3

# Ollama Export
# After fine-tuning, convert to GGUF and create Ollama model:
#   python slm/training/export_ollama.py
